name: sppb_app
description: >
  Short Physical Performance Battery (SPPB) data collection app for the
  UCF Healthy Aging Lab. Guides an administrator through the balance,
  gait speed, and chair stand components, times each trial, computes
  the standard 0-12 SPPB score, and stores all raw data in Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
