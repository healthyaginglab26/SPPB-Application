workflows:
  ios-testflight:
    name: SPPB iOS - Build & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:

      app_store_connect: sppb_app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: edu.ucf.healthyaginglab.sppbApp # must exactly
          # match the bundle ID on the app record in App Store Connect
          # and in ios/Runner.xcodeproj — confirmed to match already.
        
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "edu.ucf.healthyaginglab.sppbApp" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for TestFlight
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - SPPB Lab Testers 
  ios-sideload-unsigned:
    name: SPPB iOS - Unsigned Build (for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r ../../../unsigned.ipa Payload
    artifacts:
      - unsigned.ipa
